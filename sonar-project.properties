sonar.projectKey=Lidianacosta_BackendFinanSee
sonar.projectName=BackendFinanSee
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=tests

# ──────────────────────────────────────────────────────────────
# Exclusões (afetam análise principal, copy-paste e cobertura):
# - __pycache__/**: bytecode gerado
# - *.sqlite: banco de dados local
# - .venv/: ambiente virtual
# - .github/**: scripts de CI/CD não são código de aplicação
#   (Sonar não foi feito pra auditar pipelines YAML; as regras de
#   supply-chain são falso-positivos pois já usamos uv.lock + --frozen)
# ──────────────────────────────────────────────────────────────
sonar.exclusions=**/__pycache__/**, **/*.sqlite, **/.venv/**, **/.github/**
sonar.cpd.exclusions=**/__pycache__/**, **/*.sqlite, **/.venv/**, **/.github/**
sonar.coverage.exclusions=**/__pycache__/**, **/*.sqlite, **/.venv/**, **/.github/**
sonar.test.exclusions=**/__pycache__/**, **/*.sqlite, **/.venv/**, **/.github/**

# ──────────────────────────────────────────────────────────────
# Pin da versão Python para análise (evita warning "Python 3.9
# by default" do SonarCloud)
# ──────────────────────────────────────────────────────────────
sonar.python.version=3.12

sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=coverage.xml

sonar.sourceEncoding=UTF-8
sonar.language=py
