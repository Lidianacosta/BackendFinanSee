# See https://pre-commit.com for documentation.
# Install: uv run --with pre-commit pre-commit install
# Manual run: uv run --with pre-commit pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
