name: CI

# TODO: Adicionar testcontainers[postgres] para testes de integração


on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-22.04
    
    env:
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY || 'ci-secret-key-not-used-in-real-life-32-bytes-long!!' }}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_MINUTES: 10080
      MAIL_USERNAME: ci@finansee.test
      MAIL_PASSWORD: ""
      MAIL_SERVER: localhost
      MAIL_FROM: ci@finansee.test
      MAIL_FROM_NAME: FinanSee CI
      MAIL_PORT: 1025
      MAIL_STARTTLS: "false"
      MAIL_SSL_TLS: "false"
      USE_CREDENTIALS: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
      ENVIRONMENT: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -vvv

