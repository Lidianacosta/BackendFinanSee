name: CI

# TODO: Adicionar testcontainers[postgres] para testes de integração

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-22.04

    env:
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY || 'ci-secret-key-not-used-in-real-life-32-bytes-long!!' }}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_MINUTES: 10080
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ""
      MAIL_SERVER: localhost
      MAIL_FROM: ci@example.com
      MAIL_FROM_NAME: FinanSee CI
      MAIL_PORT: 1025
      MAIL_STARTTLS: "false"
      MAIL_SSL_TLS: "false"
      USE_CREDENTIALS: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
      ENVIRONMENT: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: "python -m pip install uv==0.11.32 --only-binary=:all: --no-build-isolation"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --frozen --no-build --no-binary-package psycopg2

      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: "python -m pip install uv==0.11.32 --only-binary=:all: --no-build-isolation"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --frozen --no-build --no-binary-package psycopg2

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
