name: CI

# TODO: Adicionar testcontainers[postgres] para testes de integração

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-22.04

    env:
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY || 'ci-secret-key-not-used-in-real-life-32-bytes-long!!' }}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_MINUTES: 10080
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ""
      MAIL_SERVER: localhost
      MAIL_FROM: ci@example.com
      MAIL_FROM_NAME: FinanSee CI
      MAIL_PORT: 1025
      MAIL_STARTTLS: "false"
      MAIL_SSL_TLS: "false"
      USE_CREDENTIALS: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
      ENVIRONMENT: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tools (for psycopg2 source build)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libpq-dev

      - name: Install dependencies (hashed, locked)
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tools (for psycopg2 source build)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libpq-dev

      - name: Install dependencies (hashed, locked)
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .
